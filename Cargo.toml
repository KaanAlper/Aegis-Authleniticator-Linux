[package]
name = "aegis-linux"
version = "0.1.0"
edition = "2021"
description = "Linux desktop client for Aegis Authenticator vaults written in Rust"

[dependencies]
eframe = "0.31"
egui = "0.31"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
aes-gcm = "0.10"
scrypt = "0.11"
rand = "0.8"
hex = "0.4"
base64 = "0.22"
data-encoding = "2"
hmac = "0.12"
sha1 = "0.10"
sha2 = "0.10"
md-5 = "0.10"
uuid = { version = "1", features = ["v4"] }
arboard = "3"
rfd = "0.15"
url = "2"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
dirs = "6"
thiserror = "2"
zeroize = { version = "1", features = ["derive"] }
ksni = "0.2"
rqrr = "0.9"

[profile.release]
opt-level = 3
lto = "thin"
strip = true
